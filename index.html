<!DOCTYPE html><html lang="en"><head><title>Redirecting...</title><meta name="robots" content="none"></head><body><script>// Configured locales may be bare "??" (e.g. "fr") or region-qualified
// "??-??" (e.g. "es-es", converted from jekyll-l10n's canonical "es_ES").
// Try an exact match first, whichever form each entry happens to use.
for(var lang=(navigator.language||navigator.userLanguage||`en-us`).toLowerCase(),match=0,locales=[`es-es`,`it-it`,`zh-cn`,`zh-hk`,`zh-tw`],i=0;i<locales.length;i++)if(lang==locales[i]){match=1;break}
// Else match on the 2-letter language prefix only, so a bare browser
// language (e.g. "es") still matches a region-qualified locale
// ("es-es"), and a region-qualified browser language (e.g. "es-mx")
// still matches a bare configured locale ("es").
if(match==0){for(var language=lang.substring(0,2),i=0;i<locales.length;i++)if(locales[i].substring(0,2)==language){lang=locales[i],match=1;break}}
// Else redirect to the unprefixed source page — jekyll-l10n always
// builds the English source page at "welcome.html" with no locale
// segment, alongside any locale-prefixed variants.
match==0?window.location=`welcome.html`:window.location=lang+`/welcome.html`;</script></body></html>
